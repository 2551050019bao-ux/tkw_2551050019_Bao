<!DOCTYPE html>
<!-- Thêm chữ 'dark' vào class bên dưới để test Dark Mode (VD: class="dark") -->
<html lang="vi" class=""> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ - KernelSync</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="font-sans antialiased">
  
  <main class="mx-auto w-full max-w-xl px-5 py-20">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-extrabold lg:text-4xl">Liên hệ đội ngũ</h1>
      <p class="mt-3 opacity-70">Nhập thông tin, chúng tôi sẽ phản hồi trong 24h.</p>
    </div>
    
    <!-- Form dùng component .card -->
    <form class="card space-y-6">
      <!-- 1. Text -->
      <div>
        <label class="field-label" for="ho-ten">Họ và tên <span class="text-red-500" aria-hidden="true">*</span></label>
        <input class="field-input" id="ho-ten" name="hoTen" type="text" required autocomplete="name">
      </div>

      <!-- 2. Email -->
      <div>
        <label class="field-label" for="email">Email công việc <span class="text-red-500" aria-hidden="true">*</span></label>
        <input class="field-input" id="email" name="email" type="email" required autocomplete="email">
      </div>

      <!-- 3. Tel -->
      <div>
        <label class="field-label" for="dien-thoai">Số điện thoại <span class="text-red-500" aria-hidden="true">*</span></label>
        <input class="field-input" id="dien-thoai" name="dienThoai" type="tel" required pattern="[0-9]{10}" autocomplete="tel" inputmode="numeric" aria-describedby="dien-thoai-hint dien-thoai-error">
        <!-- aria-describedby để máy đọc màn hình đọc luôn dòng gợi ý này -->
        <p class="mt-1.5 text-xs opacity-70" id="dien-thoai-hint">Chúng tôi gọi qua số này, không nhắn tin quảng cáo.</p>
        <p class="field-error" id="dien-thoai-error" role="alert">Vui lòng nhập đúng 10 số.</p>
      </div>

      <!-- 4. Select -->
      <div>
        <label class="field-label" for="quy-mo">Quy mô máy chủ</label>
        <select class="field-input" id="quy-mo" name="quyMo">
          <option value="nho">Dưới 10 node</option>
          <option value="vua">10 - 50 node</option>
          <option value="lon">Trên 50 node</option>
        </select>
      </div>

      <!-- 5. Textarea -->
      <div>
        <label class="field-label" for="loi-nhan">Lời nhắn</label>
        <textarea class="field-input h-32 resize-none" id="loi-nhan" name="loiNhan"></textarea>
      </div>

      <!-- 6. Checkbox -->
      <div class="flex items-start gap-3">
        <input type="checkbox" id="dong-y" name="dongY" required class="mt-1">
        <label for="dong-y" class="text-sm opacity-80 cursor-pointer">Tôi đồng ý với chính sách bảo mật và điều khoản dịch vụ.</label>
      </div>

      <button type="submit" class="btn btn-primary w-full">Gửi yêu cầu</button>
    </form>
  </main>

</body>
</html>
